services:
  router:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      JEV_PROVIDER: ${JEV_PROVIDER:-local}
      JEV_MODEL_HOST: 0.0.0.0
      JEV_MODEL_PORT: 8080
      JEV_API_KEY: ${JEV_API_KEY:-}
      JEV_BASE_URL: ${JEV_BASE_URL:-}
      JEV_MODEL: ${JEV_MODEL:-jev-latest}
      GATEWAY_BASE_URL: ${GATEWAY_BASE_URL:-}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-}
      GATEWAY_MODEL: ${GATEWAY_MODEL:-}
      GATEWAY_MODELS: ${GATEWAY_MODELS:-}
      JEV_MODELS_FILE: ${JEV_MODELS_FILE:-}
      JEV_LLM_DEFAULT: ${JEV_LLM_DEFAULT:-openrouter:anthropic/claude-sonnet-4}
      JEV_LLM_STRATEGY: ${JEV_LLM_STRATEGY:-named}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://127.0.0.1:11434/v1}
      JEV_REDACT_SECRETS: ${JEV_REDACT_SECRETS:-true}
      JEV_MODEL_AUTH_TOKEN: ${JEV_MODEL_AUTH_TOKEN:-}
